name: MEDBOT Phase 12 CI

on:
  push:
    branches:
      - 'cloudflare/phase12-*'
  pull_request:
    branches:
      - main
      - 'cloudflare/staging-finalize-*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
