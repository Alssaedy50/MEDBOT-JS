name: MEDBOT Phase 1 checks

on:
  push:
    branches:
      - main
      - 'cloudflare/**'
  pull_request:
    branches:
      - main

jobs:
  node-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
