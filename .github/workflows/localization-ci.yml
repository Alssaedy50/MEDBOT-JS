name: Localization CI

on:
  push:
    branches:
      - fix/localization-complete
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          npm run lint > lint.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat lint.log
      - name: Report lint failure
        if: steps.lint.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('lint.log', 'utf8');
            const body = '### Localization CI lint failure\
\
```text\
' + log.slice(0, 12000) + '\
```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            core.setFailed('npm run lint failed');
      - name: Test
        id: test
        continue-on-error: true
        run: |
          npm test > test.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat test.log
      - name: Report test failure
        if: steps.test.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('test.log', 'utf8');
            const body = '### Localization CI test failure\
\
```text\
' + log.slice(0, 16000) + '\
```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            core.setFailed('npm test failed');
