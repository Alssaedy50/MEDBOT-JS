name: Localization CI

on:
  push:
    branches:
      - fix/localization-complete
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Localization tests
        run: node --test test/i18n.test.js
      - name: Full test suite
        run: |
          set +e
          npm test > test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -n -E -B 12 -A 30 'not ok|failureType|ERR_TEST_FAILURE' test.log || true
          fi
          tail -n 160 test.log
          exit $code
