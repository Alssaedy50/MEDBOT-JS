name: MEDBOT Phase 13 CI
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "cloudflare/phase13-*"
      - "phase13-*"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run deploy:check
