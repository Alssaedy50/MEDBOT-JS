name: MEDBOT Phase 17 CI
on:
  push:
    branches:
      - main
      - cloudflare/phase17-*
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run cf:preflight
        env:
          CF_PREFLIGHT_ALLOW_D1_PLACEHOLDER: '1'
